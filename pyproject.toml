[project]
name = "transcriber"
version = "0.2.0"
description = "Transcribe grabaciones e identifica quién habla"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Alberto Pérez" }
]
requires-python = ">=3.12"
# El orquestador usa solo la stdlib. Whisper y pyannote se instalan aparte, en
# dos entornos aislados, con `transcriber setup`.
dependencies = []

[project.scripts]
transcribe-speakers = "transcriber.pipeline:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
